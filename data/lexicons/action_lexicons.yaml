# --- gate [3] scope qualifiers ---
# A candidate carrying one of these qualifiers is only admissible when the STEP
# carries it too. This is what rejects "auto factory reset" for "Tap Factory data reset."
scope_qualifiers:
  - auto
  - automatic
  - automatically
  - scheduled
  - schedule
  - inactivity
  - preset
  - talkback
  - screenshot
  - screenshots
  # cross-domain product qualifiers present in the production catalog
  - refrigerator
  - washer
  - dryer
  - oven
  - dishwasher
  - television
  - watch
  - buds
  - earbuds
  - cover screen
  - sub screen

# --- generic tap targets that are never a deeplink subject on their own ---
generic_targets:
